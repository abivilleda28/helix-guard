name: Publicar HELIX GUARD en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Regenera el panel, los genomas sintéticos y el bundle de la app.
      # Si algo se rompió, las pruebas lo detienen antes de publicar.
      - name: Compilar y probar
        run: |
          node scripts/build-data.mjs
          node scripts/build-app.mjs
          node tests/test.mjs

      # El sitio es la app. Se añaden los datos de ejemplo para que
      # cualquiera pueda descargarlos y cargarlos desde la interfaz.
      - name: Preparar el sitio
        run: |
          mkdir -p _site/data
          cp app/index.html _site/index.html
          cp data/*.txt _site/data/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
